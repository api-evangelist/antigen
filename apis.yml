  maps and exploits the full attack surface, and pairs the automated testing with a monthly
  human red-team assessment. Findings ship with reproduction steps and remediation guidance
  delivered directly into engineering tools such as GitHub and Linear. Antigen serves financial
  services, healthcare, retail, and government sectors, and is a Y Combinator (Fall 2025)
  company backed by Lightspeed, DST Global, and Susa Ventures.
